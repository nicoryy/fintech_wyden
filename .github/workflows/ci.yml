name: CI

# Local-first: every check here mirrors `npm run ci`, which you can run locally
# before pushing. The pipeline is the same on your machine and on GitHub.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · Lint · Test · Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (mobile)
        run: npm run typecheck

      - name: Lint (mobile)
        run: npm run lint

      - name: Test (mobile)
        run: npm test

      - name: Bundle (android)
        run: npm run build
